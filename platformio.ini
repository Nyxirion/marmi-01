[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	arkhipenko/TaskScheduler
	forntoh/LcdMenu@^5.13.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	mike-matera/ArduinoSTL@^1.3.3
	madleech/Button@^1.2.0
	adafruit/Adafruit SHT31 Library@^2.2.2
